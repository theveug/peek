services:
  peek:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Bind-mounts the accounts SQLite DB (see ACCOUNTS_DB_PATH in .env.example)
    # so it survives `docker compose down` + `up --build` on every deploy —
    # without this, a redeploy would silently wipe every registered account.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Cap container logs (Docker's default json-file driver grows unbounded):
    # at most 3 x 10 MB files, rotated automatically.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
